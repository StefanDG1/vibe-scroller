[build]
  command = "pnpm --filter @companynerve/starter... run build"
  publish = "apps/starter/.next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "12.3.4"
  SEO_PUBLIC_INDEXING = "false"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Set the package directory to apps/starter and leave the base directory at
# repository root. Credentials belong in scoped Netlify environment settings.
# The managed Next.js adapter is installed by Netlify, not the Cloudflare build.
