name: Encrypted production backup
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encrypted-production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository_id == '1396686369' && github.ref == 'refs/heads/main' && vars.VIBE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Export and encrypt without deploying or running mutations
        run: node scripts/production-backup.mjs
        env:
          VIBE_BACKUP_ENABLED: "true"
          CONVEX_DEPLOY_KEY: ${{ secrets.VIBE_BACKUP_CONVEX_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.VIBE_BACKUP_ENCRYPTION_KEY }}
      - name: Read and encrypt retained evidence without exporting storage credentials
        run: node scripts/production-evidence-backup.mjs
        env:
          VIBE_BACKUP_ENABLED: "true"
          CONVEX_DEPLOY_KEY: ${{ secrets.VIBE_BACKUP_CONVEX_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.VIBE_BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encrypted-production-backup-${{ github.run_id }}
          path: outputs/production-backup/*.sealed.json
          if-no-files-found: error
          retention-days: 7
